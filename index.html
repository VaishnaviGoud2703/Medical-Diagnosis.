<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Medical Diagnosis Assistant</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }

    .fallback {
      padding: 12px;
      text-align: center;
    }

    .fallback a {
      color: #087f8c;
    }
  </style>
</head>
<body>
  <iframe
    src="https://medical-ai-assistant.streamlit.app/?embed=true"
    title="AI Medical Diagnosis Assistant"
    allow="camera"
  ></iframe>

  <div class="fallback">
    If the application does not appear,
    <a href="https://medical-ai-assistant.streamlit.app/"
       target="_blank" rel="noopener noreferrer">
      open the app directly
    </a>.
  </div>
</body>
</html>
